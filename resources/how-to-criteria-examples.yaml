    Create a new container:

    ```bash
    lxc launch ubuntu:24.04 my-container
    ```
  - |-
    If your cloud requires a proxy, set the proxy address before bootstrapping:

    ```
    juju model-config http-proxy=http://proxy.example.com:3128
    ```

    Otherwise, proceed directly to the next step.
  - |-
    Remove the old controller:

    ```bash
    juju destroy-controller my-controller --destroy-all-models
    ```
  bad:
  - Containers can be created using the `lxc launch` command. This command supports several flags, including `--vm` for virtual machines and `--network` for specifying a network.
  - The `juju model-config` command can be used to set various model configuration options. For a full list of available options, see the reference documentation.
  - Controllers can be removed with `juju destroy-controller`. The `--destroy-all-models` flag is also available.

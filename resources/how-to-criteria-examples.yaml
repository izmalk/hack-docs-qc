- id: 22
  criterion: Check whether the guide should split into multiple guides for readability.
  good:
  - 'A single guide titled "How to back up the MAAS database" covers: stop services, run pg_dump, verify the dump file, restart services. (~500 words, one clear task.)'
  - 'Separate guides: "How to install MicroCloud", "How to initialise MicroCloud", and "How to add a MicroCloud cluster member" — each addresses one self-contained task.'
  bad:
  - 'A single guide titled "How to set up MAAS" covers: install PostgreSQL, configure PostgreSQL, install the MAAS snap, initialise MAAS, configure networking, configure DNS, configure DHCP, enable TLS, add rack controllers, commission machines, and deploy machines. (~4000 words, mixing many distinct tasks.)'
  - A single guide titled "How to manage Juju" covers bootstrapping, deploying applications, configuring applications, scaling, relating applications, managing users, managing credentials, upgrading, and destroying controllers.

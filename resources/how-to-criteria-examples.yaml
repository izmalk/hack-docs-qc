- id: 2
  criterion: The title and opening paragraph describe the same goal, without shifting scope or introducing a different task.
  good:
  - |-
    # How to configure a network bridge in LXD

    This guide shows how to create and configure a network bridge so that your LXD instances can communicate with the host network.
  - |-
    # How to set up high availability for MAAS

    This guide walks you through configuring a secondary rack controller and enabling high availability for your MAAS region.
  bad:
  - |-
    # How to configure a network bridge in LXD

    LXD supports many network types, including bridges, macvlan, sriov, and OVN. This guide provides a general overview of LXD networking concepts.
  - |-
    # How to set up high availability for MAAS

    This guide covers all aspects of MAAS installation, including snap and Debian package options, database configuration, and optional high availability setup.
